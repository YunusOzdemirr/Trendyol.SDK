name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or backfill (for example, v0.1.0-alpha.1)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag and commit
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG}"
          if [[ "${tag}" != v* ]]; then
            echo "::error::Release tags must start with v."
            exit 1
          fi

          version="${tag#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE (for example, v0.1.0-alpha.1)."
            exit 1
          fi

          tag_ref="refs/tags/${tag}"
          if ! git show-ref --verify --quiet "${tag_ref}"; then
            echo "::error::Release tag ${tag} does not exist in the repository."
            exit 1
          fi

          commit="$(git rev-list -n 1 "${tag_ref}")"
          if ! git merge-base --is-ancestor "${commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::The release tag must point to a commit on ${DEFAULT_BRANCH}."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trendyol.Sdk.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet build Trendyol.Sdk.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version="${VERSION}"
          -p:PackageVersion="${VERSION}"

      - name: Test
        run: >-
          dotnet test Trendyol.Sdk.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_REF: refs/tags/${{ steps.version.outputs.tag }}
        run: >-
          dotnet pack src/Trendyol.Sdk/Trendyol.Sdk.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true
          -p:Version="${VERSION}"
          -p:PackageVersion="${VERSION}"
          -p:PackageReleaseNotes="${RELEASE_NOTES_URL}"
          -p:RepositoryCommit="${RELEASE_COMMIT}"
          -p:RepositoryBranch="${RELEASE_REF}"

      - name: Verify package outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          test -f "artifacts/packages/Trendyol.Sdk.${VERSION}.nupkg"
          test -f "artifacts/packages/Trendyol.Sdk.${VERSION}.snupkg"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trendyol.Sdk-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish-nuget:
    name: Publish packages
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Trendyol.Sdk-${{ needs.build.outputs.version }}
          path: artifacts/packages

      - name: Validate NuGet account configuration
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER}" ]]; then
            echo "::error::Create the NUGET_USER secret in the release environment. Its value must be the NuGet.org profile name, not an email address."
            exit 1
          fi

      - name: NuGet login with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/Trendyol.Sdk.${VERSION}.nupkg"
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget add source
          --username "${GITHUB_ACTOR}"
          --password "${GITHUB_TOKEN}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"

      - name: Publish package to GitHub Packages
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/Trendyol.Sdk.${VERSION}.nupkg"
          --source github
          --no-symbols
          --skip-duplicate

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Trendyol.Sdk-${{ needs.build.outputs.version }}
          path: artifacts/packages

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::GitHub Release ${RELEASE_TAG} already exists; creation was skipped."
            exit 0
          fi

          options=(
            "${RELEASE_TAG}"
            "--repo" "${GITHUB_REPOSITORY}"
            "--verify-tag"
            "--title" "${RELEASE_TAG}"
            "--generate-notes"
          )

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            options+=("--prerelease" "--latest=false")
          else
            options+=("--latest")
          fi

          gh release create "${options[@]}" artifacts/packages/*
